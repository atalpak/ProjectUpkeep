# Pull-request checks: lint, typecheck, unit tests, production build, the
# migrations applied to a real Postgres, and (separately) the mobile
# workspace's own typecheck/test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # apps/mobile and packages/scan-core, packages/upkeep-vision are Expo/RN
      # workspaces (see .claude/rules/mobile.md) with their own CI job below.
      # This job only covers the Next.js app, so skip installing those —
      # otherwise every push pulls in the whole Expo/RN toolchain for a job
      # that never touches it. packages/upkeep-domain is the one exception:
      # it is framework-free (no RN/Expo deps of its own) and the web app now
      # imports it directly (src/lib/collection/stacking.ts), so it needs to
      # be installed here too.
      # Note: root `npm run lint` also lints apps/** and packages/** (the Expo
      # block in eslint.config.mjs). That block is not type-aware on purpose,
      # so it needs none of the skipped workspaces installed — keep it that way.
      - run: npm ci --workspace=packages/upkeep-domain --include-workspace-root=true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        # The build only needs these to be present and well-formed, not real:
        # nothing is fetched from Supabase at build time.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

      - name: NEXT_PUBLIC_ env is inlined into the server bundle
        # scripts/env.test.ts pins the loud-failure behaviour but cannot catch a
        # regression from static process.env.NEXT_PUBLIC_* access back to dynamic
        # process.env[name] — the two behave identically under tsx. Next only
        # inlines the static form, so the placeholder URL from the Build step
        # must appear literally in the built server/Edge output. If it does not,
        # src/lib/env.ts has gone back to dynamic access.
        run: |
          grep -rqF "placeholder.supabase.co" .next/server/ || {
            echo "NEXT_PUBLIC_ env not inlined into server bundle — check src/lib/env.ts uses static process.env access"
            exit 1
          }

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Full workspace install here, unlike the `app` job — this is the one
      # job that actually needs the Expo/RN toolchain. No native iOS/Android
      # build is attempted in CI; that's out of scope for this phase (see
      # .claude/rules/mobile.md).
      - run: npm ci
      - run: npm run typecheck -w @upkeep/domain
      - run: npm test -w @upkeep/domain
      - run: npm run typecheck -w @upkeep/scan-core
      - run: npm test -w @upkeep/scan-core
      # `strict` is set in apps/mobile/tsconfig.json itself, so this one step is
      # the strict typecheck.
      - run: npm run typecheck -w @upkeep/scanner-app
      # Same root eslint.config.mjs as the app job; it carries a separate
      # Expo/RN block for apps/** and packages/**. Needs the full install above.
      - run: npx eslint apps packages

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - name: Apply migrations and run schema tests
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/verify-migrations.sh
