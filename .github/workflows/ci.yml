# Pull-request checks: lint, typecheck, unit tests, production build, the
# migrations applied to a real Postgres, and (separately) the mobile
# workspace's own typecheck/test and the scanner's Swift gate checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # apps/mobile and packages/scan-core, packages/upkeep-vision are Expo/RN
      # workspaces (see .claude/rules/mobile.md) with their own CI job below.
      # This job only covers the Next.js app, so skip installing those —
      # otherwise every push pulls in the whole Expo/RN toolchain for a job
      # that never touches it. packages/upkeep-domain is the one exception:
      # it is framework-free (no RN/Expo deps of its own) and the web app now
      # imports it directly (src/lib/collection/stacking.ts), so it needs to
      # be installed here too.
      # Note: root `npm run lint` also lints apps/** and packages/** (the Expo
      # block in eslint.config.mjs). That block is not type-aware on purpose,
      # so it needs none of the skipped workspaces installed — keep it that way.
      - run: npm ci --workspace=packages/upkeep-domain --include-workspace-root=true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        # The build only needs these to be present and well-formed, not real:
        # nothing is fetched from Supabase at build time.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

      - name: NEXT_PUBLIC_ env is inlined into the server bundle
        # scripts/env.test.ts pins the loud-failure behaviour but cannot catch a
        # regression from static process.env.NEXT_PUBLIC_* access back to dynamic
        # process.env[name] — the two behave identically under tsx. Next only
        # inlines the static form, so the placeholder URL from the Build step
        # must appear literally in the built server/Edge output. If it does not,
        # src/lib/env.ts has gone back to dynamic access.
        run: |
          grep -rqF "placeholder.supabase.co" .next/server/ || {
            echo "NEXT_PUBLIC_ env not inlined into server bundle — check src/lib/env.ts uses static process.env access"
            exit 1
          }

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Full workspace install here, unlike the `app` job — this is the one
      # job that actually needs the Expo/RN toolchain. No native iOS/Android
      # build is attempted in CI; that's out of scope for this phase (see
      # .claude/rules/mobile.md).
      - run: npm ci
      - run: npm run typecheck -w @upkeep/domain
      - run: npm test -w @upkeep/domain
      - run: npm run typecheck -w @upkeep/scan-core
      - run: npm test -w @upkeep/scan-core
      # `strict` is set in apps/mobile/tsconfig.json itself, so this one step is
      # the strict typecheck.
      - run: npm run typecheck -w @upkeep/scanner-app
      # Same root eslint.config.mjs as the app job; it carries a separate
      # Expo/RN block for apps/** and packages/**. Needs the full install above.
      - run: npx eslint apps packages

  # Nothing else in CI compiles Swift, so the scanner's detection gate could
  # drift or stop building with every other job green. This job compiles the
  # SHIPPED ios/UpkeepCardVision.swift and runs the offline gate checks against
  # it (see the header of check-full-card-gate.swift). It needs no Node, no
  # Expo and no Xcode project: swiftc and the macOS SDK ship with the runner.
  #
  # What it does NOT cover: UpkeepScannerView.swift and UpkeepVisionModule.swift
  # import ExpoModulesCore, which only exists inside an Expo/CocoaPods build, so
  # they are never compiled here; live camera capture and OCR on real frames
  # are likewise untested (validate-detection.swift needs still images and is
  # only compile-checked). A break in those files still surfaces only in a
  # native rebuild on the owner's Mac.
  scanner-swift:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Compile the shipped file and run the gate checks
        # The script is copied to main.swift only because swiftc allows
        # top-level statements in a file of that name and nowhere else. A
        # failed expectation exits non-zero, which fails the step.
        run: |
          TMP="$RUNNER_TEMP/gate"
          mkdir -p "$TMP"
          cp packages/upkeep-vision/scripts/check-full-card-gate.swift "$TMP/main.swift"
          swiftc -o "$TMP/check" packages/upkeep-vision/ios/UpkeepCardVision.swift "$TMP/main.swift"
          "$TMP/check"
      - name: Type-check the shipped file against the iOS SDK
        # The gate checks above build for macOS; the app ships for iOS, where
        # an API can differ or be missing. Type-check only (no link, no run).
        # 15.1 matches the podspec's deployment target.
        run: |
          swiftc -typecheck \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -target arm64-apple-ios15.1-simulator \
            packages/upkeep-vision/ios/UpkeepCardVision.swift
      - name: Type-check the offline validator
        # validate-detection.swift is hand-run against still frames, so nothing
        # would notice it stop compiling. Compile-check only; it needs images.
        run: |
          TMP="$RUNNER_TEMP/validate"
          mkdir -p "$TMP"
          cp packages/upkeep-vision/scripts/validate-detection.swift "$TMP/main.swift"
          swiftc -typecheck packages/upkeep-vision/ios/UpkeepCardVision.swift "$TMP/main.swift"
      # The app's pure-logic tests: data modules with the Supabase client and
      # Expo file/secure-store swapped for in-memory fakes (apps/mobile/test/
      # helpers). Screens and components are still untested.
      - run: npm test -w @upkeep/scanner-app

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - name: Apply migrations and run schema tests
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/verify-migrations.sh

  # This proves the migrations are internally consistent against a throwaway
  # database (the job above) -- it says nothing about whether the LINKED
  # PRODUCTION project has actually run them. Migrations 36-38 and 40 both
  # went unapplied in production while every other check stayed green; this
  # job is what would have caught that. Runs only on main, where "not yet
  # applied" is an actual production gap rather than routine PR-branch noise.
  # Skips (not fails) when SUPABASE_ACCESS_TOKEN isn't configured, so a fork
  # PR or a repo without the secret set up is never blocked by this.
  migration-drift:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check local migrations are applied to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: gttbehblxlwxszrbtsoc
        run: ./scripts/check-migrations-applied.sh
