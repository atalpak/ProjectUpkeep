# Scheduled Scryfall sync.
#
# This is what makes the sync "a real repeatable job, not a hack": it runs
# unattended on a schedule, and a failure is visible in the Actions tab and in
# public.scryfall_sync_runs rather than only in someone's terminal history.
#
# Scryfall regenerates the bulk exports roughly daily. Running a little after
# their usual refresh means we normally pick up a fresh export; when the export
# has not changed, the job notices via its stored bulk_updated_at and exits
# without downloading anything.
#
# Setup: add NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as repository
# secrets (Settings -> Secrets and variables -> Actions).
# NEXT_PUBLIC_SUPABASE_ANON_KEY is a public value (safe in client bundles
# already), added as a plain repository variable rather than a secret, and
# used by the mobile-catalog steps below to read `public.cards` with no
# elevated privilege.
#
# Mobile catalog (added mobile-app initiative phase 5): export -> build ->
# publish only runs when the sync says the catalog needs it — see
# sync-scryfall.ts's $GITHUB_OUTPUT write (`upserted`, kept under that name for
# the steps below). The sync writes only rows that changed, and the catalog has
# no prices, so on most days nothing it contains has changed and a ~30MB upload
# would be wasted. It still reports true when an earlier run died after
# writing, or when an earlier publish never landed: the publish step stamps
# scryfall_sync_runs.catalog_published_at only after its uploads succeed, and
# the next sync republishes while a run that needed one is still unstamped.
# That is why a failed publish here is retried tomorrow rather than forgotten.
#
# Oracle loader (added with migrations 43-44): the LAST steps, loading Scryfall's
# oracle_cards export into public.oracle_cards over a direct Postgres connection
# (scripts/sync-oracle-direct.ts). Two properties are deliberate:
#   - It can never fail or delay the printings sync or the catalog. It runs after
#     them, and `continue-on-error` keeps its own failure from turning the job red
#     (the run is still recorded as `failed` in scryfall_sync_runs, and a warning
#     annotation is written to the run summary). It runs even when the printings
#     sync failed (`!cancelled()`), because the two touch different tables.
#   - It exists only when its secret does. Add SCRYFALL_SYNC_DATABASE_URL (the
#     session-pooler string for the scryfall_loader role, port 5432) and, if the
#     pooler's certificate does not chain to a public CA, SCRYFALL_SYNC_DATABASE_CA
#     (PEM). Without the URL the step logs that it is skipping and the job is
#     exactly what it was before. See migration 44 for how to enable the role.
# It shares this job, and therefore the concurrency group below: two loaders
# writing at once buys nothing, and the loader's own lock_timeout (5s) keeps it
# from queueing behind anything.

name: Scryfall sync

on:
  schedule:
    # 09:15 UTC daily. Off the hour on purpose — scheduled jobs on the hour
    # queue behind everyone else's cron on GitHub's shared runners.
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download even if the export has not changed upstream"
        type: boolean
        default: false

concurrency:
  # Two syncs upserting the same table at once buys nothing and can trip
  # statement timeouts on the free tier.
  group: scryfall-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # The full default_cards export is a few hundred MB; a slow run should fail
    # loudly rather than burn Actions minutes for six hours.
    timeout-minutes: 45
    env:
      # `secrets` cannot be tested in a step's `if:` directly, only through an
      # env value; this is true only when the loader's secret has been added.
      HAS_LOADER_DB: ${{ secrets.SCRYFALL_SYNC_DATABASE_URL != '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run sync
        id: sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRYFALL_CONTACT: "project-upkeep (+https://github.com/${{ github.repository }})"
        run: npm run sync:scryfall ${{ inputs.force && '-- --force' || '' }}

      # Mobile catalog: export -> build -> publish, gated on the sync above
      # having actually upserted something (see the module comment). Reads
      # from the `vars.*` context, not `secrets.*` — NEXT_PUBLIC_SUPABASE_ANON_KEY
      # is a public value, already compiled into the web app's client bundle
      # and `apps/mobile`'s own build (see .env.example), so it belongs in
      # Settings -> Secrets and variables -> Actions -> Variables, not Secrets.
      # `secrets.*` and `vars.*` are separate namespaces in Actions: a value
      # configured as a variable is simply absent under `secrets.*` (empty
      # string, no error), which is exactly the failure this once had.
      - name: Export catalog
        if: steps.sync.outputs.upserted == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx tsx scripts/export-catalog.ts /tmp/catalog-cards.jsonl

      - name: Build catalog
        if: steps.sync.outputs.upserted == 'true'
        run: npm run catalog:build -w @upkeep/scan-core -- /tmp/catalog-cards.jsonl /tmp/catalog-v1.json "$(date -u +%Y-%m-%dT%H%M%SZ)"

      - name: Publish catalog
        if: steps.sync.outputs.upserted == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/publish-catalog.ts /tmp/catalog-v1.json

      # Oracle loader: see the header. Last on purpose, never fatal.
      - name: Oracle loader skipped (no SCRYFALL_SYNC_DATABASE_URL secret)
        if: ${{ !cancelled() && env.HAS_LOADER_DB != 'true' }}
        run: echo "SCRYFALL_SYNC_DATABASE_URL is not set, so the direct-Postgres oracle_cards load is skipped. Nothing else is affected."

      - name: Load oracle_cards (direct Postgres)
        id: oracle
        if: ${{ !cancelled() && env.HAS_LOADER_DB == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          SCRYFALL_SYNC_DATABASE_URL: ${{ secrets.SCRYFALL_SYNC_DATABASE_URL }}
          SCRYFALL_SYNC_DATABASE_CA: ${{ secrets.SCRYFALL_SYNC_DATABASE_CA }}
          SCRYFALL_CONTACT: "project-upkeep (+https://github.com/${{ github.repository }})"
        run: npm run sync:oracle ${{ inputs.force && '-- --force' || '' }}

      - name: Oracle load failed (warning only)
        if: ${{ !cancelled() && steps.oracle.outcome == 'failure' }}
        run: echo "::warning title=oracle_cards load failed::The direct-Postgres oracle_cards load failed. The printings sync and the catalog are unaffected. See the step log and the newest oracle_cards row in scryfall_sync_runs."
