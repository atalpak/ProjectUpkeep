# Supabase local development config. Used by `supabase start` / `supabase db reset`.
# Production settings live in the Supabase dashboard, not here.

project_id = "project-upkeep"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Off locally so signup gives you a session immediately. Leave it ON in
# production — the signup action already handles the no-session case by telling
# the user to check their email.
enable_confirmations = false
